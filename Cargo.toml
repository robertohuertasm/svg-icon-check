[package]
name = "svg-icon-check"
description = "Small utility to check how an SVG icon looks like on different backgrounds"
version = "0.1.0"
license = "MIT"
edition = "2024"
rust-version = "1.85"
authors = [
  "Roberto Huertas <roberto.huertas@outlook.com>",
  "Dimitris \"Jimi\" Charalampidis <jimikar@gmail.com>",
]

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive", "cargo"] }
image = "0.25.0"
resvg = "0.50.0"
tempfile = "3.27.0"
tiny-skia = "0.12.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
